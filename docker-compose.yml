version: "3.8"

x-frappe-app-common: &frappe-app-common
  image: ghcr.io/frappe/lms:stable
  platform: linux/amd64
  pull_policy: missing
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - bank-transfer-app:/home/frappe/frappe-bench/apps/bank_transfer_gateway

services:
  db:
    image: mariadb:10.6
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
      - "--skip-character-set-client-handshake"
      - "--skip-innodb-read-only-compressed"
    environment:
      MYSQL_ROOT_PASSWORD: MyDbRss1frv0vSnrb
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      default: null

  redis-cache:
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - redis-cache-data:/data
    networks:
      default: null

  redis-queue:
    image: redis:6.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
    volumes:
      - redis-queue-data:/data
    networks:
      default: null

  # This runs FIRST - clones/updates bank_transfer_gateway and installs it
  apps-init:
    <<: *frappe-app-common
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        echo "=== Apps Init Starting ==="
        
        # Clone or update bank_transfer_gateway
        if [ ! -f "/home/frappe/frappe-bench/apps/bank_transfer_gateway/setup.py" ]; then
          echo "Cloning bank_transfer_gateway..."
          rm -rf /home/frappe/frappe-bench/apps/bank_transfer_gateway/*
          cd /home/frappe/frappe-bench/apps
          git clone https://github.com/Dinu-Sri/bank_transfer_gateway.git bank_transfer_gateway_temp
          mv bank_transfer_gateway_temp/* bank_transfer_gateway/
          mv bank_transfer_gateway_temp/.* bank_transfer_gateway/ 2>/dev/null || true
          rm -rf bank_transfer_gateway_temp
        else
          echo "Updating bank_transfer_gateway..."
          cd /home/frappe/frappe-bench/apps/bank_transfer_gateway
          git fetch origin
          git reset --hard origin/master
        fi
        
        # Install the package
        echo "Installing bank_transfer_gateway package..."
        pip install -e /home/frappe/frappe-bench/apps/bank_transfer_gateway
        
        # Copy assets to sites folder (where nginx serves from)
        echo "Copying assets..."
        mkdir -p /home/frappe/frappe-bench/sites/assets/bank_transfer_gateway/js
        cp /home/frappe/frappe-bench/apps/bank_transfer_gateway/bank_transfer_gateway/public/js/bank_transfer.js /home/frappe/frappe-bench/sites/assets/bank_transfer_gateway/js/
        
        # Ensure bank_transfer_gateway is in apps.txt
        if ! grep -q "bank_transfer_gateway" /home/frappe/frappe-bench/sites/apps.txt 2>/dev/null; then
          echo "bank_transfer_gateway" >> /home/frappe/frappe-bench/sites/apps.txt
          echo "Added bank_transfer_gateway to apps.txt"
        fi
        
        echo "=== Apps Init Complete ==="
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    networks:
      default: null

  configurator:
    <<: *frappe-app-common
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - |
        ls -1 apps > sites/apps.txt;
        # Ensure bank_transfer_gateway is included
        if ! grep -q "bank_transfer_gateway" sites/apps.txt 2>/dev/null; then
          echo "bank_transfer_gateway" >> sites/apps.txt
        fi
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: "redis-cache:6379"
      REDIS_QUEUE: "redis-queue:6379"
      SOCKETIO_PORT: "9000"
    depends_on:
      apps-init:
        condition: service_completed_successfully
    networks:
      default: null

  backend:
    <<: *frappe-app-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install -e /home/frappe/frappe-bench/apps/bank_transfer_gateway 2>/dev/null || true
        exec /home/frappe/frappe-bench/env/bin/gunicorn --bind 0.0.0.0:8000 --workers 4 --timeout 120 --graceful-timeout 30 frappe.app:application --preload
    environment:
      FRAPPE_SITE: frontend
    depends_on:
      configurator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8000"]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      default: null

  scheduler:
    <<: *frappe-app-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install -e /home/frappe/frappe-bench/apps/bank_transfer_gateway 2>/dev/null || true
        exec bench schedule
    depends_on:
      configurator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      default: null

  queue-long:
    <<: *frappe-app-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install -e /home/frappe/frappe-bench/apps/bank_transfer_gateway 2>/dev/null || true
        exec bench worker --queue long,default,short
    depends_on:
      configurator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      default: null

  queue-short:
    <<: *frappe-app-common
    entrypoint: ["bash", "-c"]
    command:
      - |
        pip install -e /home/frappe/frappe-bench/apps/bank_transfer_gateway 2>/dev/null || true
        exec bench worker --queue short,default
    depends_on:
      configurator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wait-for-it", "redis-queue:6379"]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      default: null

  websocket:
    <<: *frappe-app-common
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      FRAPPE_SITE: frontend
    depends_on:
      configurator:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:9000"]
      interval: 2s
      timeout: 10s
      retries: 30
    networks:
      default: null

  frontend:
    <<: *frappe-app-common
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      CLIENT_MAX_BODY_SIZE: 50m
      FRAPPE_SITE_NAME_HEADER: frontend
      PROXY_READ_TIMEOUT: "120"
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
    depends_on:
      backend:
        condition: service_started
      websocket:
        condition: service_started
    healthcheck:
      test: ["CMD", "wait-for-it", "0.0.0.0:8080"]
      interval: 2s
      timeout: 10s
      retries: 30
    ports:
      - "8080:8080"
    networks:
      default: null

  create-site:
    <<: *frappe-app-common
    restart: "no"
    environment:
      ADMIN_PASS: bRss1frv0vSnrb
    entrypoint: ["bash", "-c"]
    command:
      - |
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1;
          fi;
        done;
        echo "sites/common_site_config.json found";
        bench new-site \
          --mariadb-user-host-login-scope='%' \
          --admin-password=$$ADMIN_PASS \
          --db-root-username=root \
          --db-root-password=MyDbRss1frv0vSnrb \
          --install-app lms \
          --set-default frontend;
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      default: null

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiMTU2N2U0MmQ3YTQ0M2QwZmE1YmZiYjMyOTc3YTA5ZTciLCJ0IjoiN2M3YWJlMzItZjQxNC00NDUzLWFhOGItZTNmMzA0NWMyMTU5IiwicyI6Ik5EWTRPR1ZsWW1FdFlXRXlZeTAwTVdRMExXSTBaakF0TkRaa1pXVmtaRFZrTXpGaiJ9
    depends_on:
      - frontend
    networks:
      default: null

volumes:
  sites:
  bank-transfer-app:
  db-data:
  redis-cache-data:
  redis-queue-data:
